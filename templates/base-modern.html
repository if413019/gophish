{{ define "base" }}
<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="phi.shin - Advanced Phishing Simulation Platform">
    <meta name="author" content="phi.shin Team">
    <link rel="shortcut icon" href="/images/favicon.ico">

    <title>{{ .Title }} - phi.shin</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- TW-Elements CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tw-elements/dist/css/tw-elements.min.css" />
    
    <!-- Custom phi.shin styles -->
    <link href="/css/phishin-modern.css" rel="stylesheet" type="text/css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js for dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        // Configure Tailwind
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            500: '#667eea',
                            600: '#5a67d8',
                            700: '#4c51bf',
                        },
                        secondary: {
                            500: '#764ba2',
                            600: '#6b46c1',
                        }
                    }
                }
            }
        }
    </script>
    
    <script>
        // User and CSRF data (properly escaped for security)
        {{if .User}}
        var user = {
            api_key : {{ .User.ApiKey | js }},
            username : {{ .User.Username | js }}
        };
        {{end}}
        {{if .Token}}
            var csrf_token = {{ .Token | js }};
        {{end}}
    </script>
</head>

<body class="h-full font-sans antialiased">
    <div class="min-h-full">
        <!-- Navigation -->
        <nav class="bg-white shadow-sm border-b border-gray-200 fixed w-full z-30 top-0">
            <div class="mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <!-- Mobile menu button -->
                        <button type="button" class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500" id="mobile-menu-button">
                            <span class="sr-only">Open main menu</span>
                            <i class="fas fa-bars h-6 w-6"></i>
                        </button>
                        
                        <!-- Logo -->
                        <div class="flex-shrink-0 flex items-center ml-4 md:ml-0">
                            <img class="h-8 w-auto" src="/images/phishin_logo_small.svg" alt="phi.shin">
                        </div>
                    </div>

                    <!-- Right side navigation -->
                    <div class="flex items-center space-x-4">
                        {{if .User}}
                        <!-- User dropdown -->
                        <div class="relative" data-te-dropdown-ref>
                            <button class="flex items-center space-x-2 text-sm rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500" type="button" data-te-dropdown-toggle-ref>
                                <div class="h-8 w-8 rounded-full bg-gradient-to-r from-indigo-500 to-purple-600 flex items-center justify-center">
                                    <span class="text-white text-sm font-medium">{{substr .User.Username 0 1 | upper}}</span>
                                </div>
                                <span class="hidden md:block text-gray-700 font-medium">{{.User.Username}}</span>
                                <i class="fas fa-chevron-down text-gray-400"></i>
                            </button>
                            
                            <ul class="absolute right-0 z-[1000] float-left m-0 mt-1 hidden min-w-max list-none overflow-hidden rounded-lg border-none bg-white bg-clip-padding text-left text-base shadow-lg data-[te-dropdown-show]:block" data-te-dropdown-menu-ref>
                                <li>
                                    <a class="block w-full whitespace-nowrap bg-transparent px-4 py-2 text-sm font-normal text-neutral-700 hover:bg-neutral-100 active:text-neutral-800 active:no-underline disabled:pointer-events-none disabled:bg-transparent disabled:text-neutral-400" href="/settings">
                                        <i class="fas fa-user mr-2"></i>Account Settings
                                    </a>
                                </li>
                                <li><hr class="my-2 h-0 border border-t-0 border-solid border-neutral-700 opacity-25"></li>
                                <li>
                                    <a class="block w-full whitespace-nowrap bg-transparent px-4 py-2 text-sm font-normal text-neutral-700 hover:bg-neutral-100 active:text-neutral-800 active:no-underline disabled:pointer-events-none disabled:bg-transparent disabled:text-neutral-400" href="/logout">
                                        <i class="fas fa-sign-out-alt mr-2"></i>Sign out
                                    </a>
                                </li>
                            </ul>
                        </div>
                        {{else}}
                        <a href="/login" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            Sign in
                        </a>
                        {{end}}
                    </div>
                </div>
            </div>
        </nav>

        <!-- Mobile menu overlay -->
        <div class="md:hidden fixed inset-0 z-40 hidden" id="mobile-menu-overlay">
            <div class="fixed inset-0 bg-gray-600 bg-opacity-75"></div>
            <div class="fixed inset-y-0 left-0 flex flex-col w-64 bg-white">
                <div class="flex items-center justify-between h-16 px-4 border-b border-gray-200">
                    <img class="h-8 w-auto" src="/images/phishin_logo_small.svg" alt="phi.shin">
                    <button type="button" class="text-gray-400 hover:text-gray-500" id="mobile-menu-close">
                        <i class="fas fa-times h-6 w-6"></i>
                    </button>
                </div>
                <nav class="flex-1 px-4 py-4 space-y-1">
                    {{template "mobile-nav" .}}
                </nav>
            </div>
        </div>

        <div class="flex h-screen pt-16">
            <!-- Sidebar for desktop -->
            <div class="hidden md:flex md:flex-shrink-0">
                <div class="flex flex-col w-64">
                    <div class="flex flex-col h-0 flex-1 bg-white border-r border-gray-200">
                        <div class="flex-1 flex flex-col pt-5 pb-4 overflow-y-auto">
                            <nav class="mt-5 flex-1 px-2 space-y-1">
                                {{template "nav" .}}
                            </nav>
                        </div>
                        
                        <!-- Help section -->
                        <div class="flex-shrink-0 border-t border-gray-200 p-4">
                            <div class="text-sm text-gray-500 mb-2">Need help?</div>
                            <div class="space-y-1">
                                <a href="https://docs.phi-shin.com" class="text-sm text-indigo-600 hover:text-indigo-500 block">
                                    <i class="fas fa-book mr-2"></i>Documentation
                                </a>
                                <a href="https://support.phi-shin.com" class="text-sm text-indigo-600 hover:text-indigo-500 block">
                                    <i class="fas fa-life-ring mr-2"></i>Support
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main content -->
            <div class="flex flex-col w-0 flex-1 overflow-hidden">
                <main class="flex-1 relative overflow-y-auto focus:outline-none">
                    {{template "body" .}}
                </main>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/tw-elements/dist/js/tw-elements.umd.min.js"></script>
    <script src="/js/dist/vendor.min.js"></script>
    <script src="/js/dist/app/gophish.min.js"></script>
    
    <!-- Mobile menu toggle script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');
            const mobileMenuClose = document.getElementById('mobile-menu-close');
            
            if (mobileMenuButton && mobileMenuOverlay && mobileMenuClose) {
                mobileMenuButton.addEventListener('click', function() {
                    mobileMenuOverlay.classList.remove('hidden');
                });
                
                mobileMenuClose.addEventListener('click', function() {
                    mobileMenuOverlay.classList.add('hidden');
                });
                
                mobileMenuOverlay.addEventListener('click', function(e) {
                    if (e.target === mobileMenuOverlay) {
                        mobileMenuOverlay.classList.add('hidden');
                    }
                });
            }
        });
    </script>
    
    {{template "scripts" .}}
</body>

</html>
{{ end }}
