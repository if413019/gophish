{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <div class="row">
        <h1 class="page-header">Settings</h1>
    </div>
    <div id="flashes" class="row"></div>
    {{template "flashes" .Flashes}}
    <!-- Nav tabs -->
    <ul class="nav nav-tabs" role="tablist">
        <li class="active" role="mainSettings"><a href="#mainSettings" aria-controls="mainSettings" role="tab"
                data-toggle="tab">Account Settings</a></li>
        <li role="uiSettings"><a href="#uiSettings" aria-controls="uiSettings" role="tab" data-toggle="tab">UI
                Settings</a></li>
        <li role="reportingSettings"><a href="#reportingSettings" aria-controls="reportingSettings" role="tab" id="reporttab"
            data-toggle="tab">Reporting Settings</a></li>
    </ul>
    <!-- Tab Panes -->
    <div class="tab-content">
        <div role="tabpanel" class="tab-pane active" id="mainSettings">
            <br />
            {{if .ModifySystem }}
            <div class="row">
                <label class="col-sm-2 control-label form-label">Gophish version</label>
                <div class="col-md-6">
                    <label class="form-label">{{.Version}}</label>
                </div>
            </div>
            <br />
            {{end}}
            <div class="row">
                <label for="api_key" class="col-sm-2 control-label form-label">API Key:</label>
                <div class="col-md-6">
                    <input type="text" id="api_key" onclick="this.select();" value="{{.User.ApiKey}}"
                        class="form-control" readonly />
                </div>
                <form id="apiResetForm">
                    <button class="btn btn-primary"><i class="fa fa-refresh" type="submit"></i> Reset</button>
                    <input type="hidden" name="csrf_token" value="{{.Token}}" />
                </form>
            </div>
            <br />
            <form id="settingsForm">
                <div class="row">
                    <label for="username" class="col-sm-2 control-label form-label">Username:</label>
                    <div class="col-md-6">
                        <input type="text" id="username" name="username" value="{{.User.Username}}"
                            class="form-control" />
                    </div>
                </div>
                <br />
                <div class="row">
                    <label for="current_password" class="col-sm-2 control-label form-label">Old Password:</label>
                    <div class="col-md-6">
                        <input type="password" id="current_password" name="current_password" autocomplete="off"
                            class="form-control" />
                    </div>
                </div>
                <br />
                <div class="row">
                    <label for="new_password" class="col-sm-2 control-label form-label">New Password:</label>
                    <div class="col-md-6">
                        <input type="password" id="password" name="new_password" autocomplete="new-password"
                            class="form-control" />
                        <div class="hidden" id="password-strength-container">
                            <div class="progress" id="password-strength">
                                <div id="password-strength-bar" class="progress-bar" role="progressbar"
                                    aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            <span id="password-strength-description"></span>
                        </div>
                    </div>
                </div>
                <br />
                <div class="row">
                    <label for="confirm_new_password" class="col-sm-2 control-label form-label">Confirm New
                        Password:</label>
                    <div class="col-md-6">
                        <input type="password" id="confirm_new_password" name="confirm_new_password" autocomplete="off"
                            class="form-control" />
                    </div>
                </div>
                <input type="hidden" name="csrf_token" value="{{.Token}}" />
                <br />
                <button class="btn btn-primary" type="submit"><i class="fa fa-save"></i> Save</button>
            </form>
            <br />
        </div>
        <div role="tabpanel" class="tab-pane" id="uiSettings">
            <br />
            <div class="checkbox checkbox-primary">
                <input id="use_map" type="checkbox">
                <label for="use_map">Show campaign results map</label>
            </div>
        </div>
        <!-- Reporting Settings Begin -->
        <div role="tabpanel" class="tab-pane" id="reportingSettings">
            <form id="imapForm" >
            <br />
            <div class="row">
                <div class="col-md-6">
                    Monitor an IMAP account for emails reported by users.
                </div>
             </div>
            <br />

            <div class="row">
                <div class="col-md-6">
                <div class="checkbox checkbox-primary">
                    <input id="use_imap" type="checkbox">
                    <label for="use_imap">Enable Email Account Monitoring</label>
                </div>
                </div>
             </div>
            <br />

            
            <div class="row">
                <label for="imaphost" class="col-sm-2 control-label form-label">IMAP Host:</label>
                <div class="col-md-6">
                    <input type="text" id="imaphost" name="imaphost" placeholder="imap.example.com"
                        class="form-control" />
                </div>
            </div>
            <br />

            <div class="row">
                <label for="imapport" class="col-sm-2 control-label form-label">IMAP Port:</label>
                <div class="col-md-6">
                    <input type="text" id="imapport" name="imapport" placeholder="993"
                        class="form-control" />
                </div>
            </div>
            <br />

            <div class="row">
                <label for="imapusername" class="col-sm-2 control-label form-label">IMAP Username:</label>
                <div class="col-md-6">
                    <input type="text" id="imapusername" name="imapusername" placeholder="Username"
                        class="form-control" />
                </div>
            </div>
            <br />

            <div class="row">
                <label for="imappassword" class="col-sm-2 control-label form-label">IMAP Password:</label>
                <div class="col-md-6">
                    <input type="password" id="imappassword" name="imappassword" placeholder="Password" autocomplete="off"
                        class="form-control" />
                </div>
            </div>
            <br />


            <div class="row">
                <label for="use_tls" class="col-sm-2 control-label form-label">Use TLS:</label>
                <div class="col-md-6">
                    <div class="checkbox checkbox-primary">
                        <input id="use_tls" type="checkbox">
                        <label for="use_tls"></label>
                    </div>
                    
                </div>
            </div>

             <!-- Advanced Settings-->
            <div id="advancedarea" style="display: none;">
                <hr>
                <div class="row">
                <label for="folder" class="col-sm-2 control-label form-label">Folder:</label>
                    <div class="col-md-6">
                        <input type="text" id="folder" name="folder" placeholder="Leave blank for default of INBOX."
                            class="form-control" />
                    </div>
                </div>
                <br />

                <div class="row">
                    <label for="folder" class="col-sm-2 control-label form-label">Polling frequency: 
                        <span class="tooltip-trigger relative inline-block ml-1" data-tooltip="How often to check for new emails. 30 seconds minimum.">
                            <i class="fa fa-question-circle text-cyan-400/70 cursor-help hover:text-cyan-300 transition-colors"></i>
                        </span>
                    </label>
                        <div class="col-md-6">
                            <input type="number" id="imapfreq" name="imapfreq" placeholder="Leave blank for default of every 60 seconds."
                                class="form-control" />
                        </div>
                    </div>
                    <br />
        
                <div class="row">
                    <label for="restrictdomain" class="col-sm-2 control-label form-label">Restrict to domain: 
                        <span class="tooltip-trigger relative inline-block ml-1" data-tooltip="Only check emails reported from the supplied domain.">
                            <i class="fa fa-question-circle text-cyan-400/70 cursor-help hover:text-cyan-300 transition-colors"></i>
                        </span>
                    </label>
                    <div class="col-md-6">
                        <input type="text" id="restrictdomain" name="restrictdomain" placeholder="e.g. widgets.com. Leave blank for all domains."
                            class="form-control" />
                    </div>
                </div>
                <br />

                <div class="row">
                    <label for="ignorecerterrors" class="col-sm-2 control-label form-label">Ignore Certificate Errors: 
                        <span class="tooltip-trigger relative inline-block ml-1" data-tooltip="Ignore common certificate errors such as self-signed certs (exposes you to MiTM attacks - use carefully!)">
                            <i class="fa fa-question-circle text-cyan-400/70 cursor-help hover:text-cyan-300 transition-colors"></i>
                        </span>
                    </label>
                    <div class="col-md-6">
                        <div class="checkbox checkbox-primary">
                            <input id="ignorecerterrors" type="checkbox">
                            <label for="ignorecerterrors"></label>
                        </div>
                    </div>
                </div>
                <br />

                <div class="row">
                    <label for="deletecampaign" class="col-sm-2 control-label form-label">Delete campaigns emails: 
                        <span class="tooltip-trigger relative inline-block ml-1" data-tooltip="Delete campaign emails after they've been reported.">
                            <i class="fa fa-question-circle text-cyan-400/70 cursor-help hover:text-cyan-300 transition-colors"></i>
                        </span>
                    </label>
                    <div class="col-md-6">
                        <div class="checkbox checkbox-primary">
                            <input id="deletecampaign" type="checkbox">
                            <label for="deletecampaign"></label>
                        </div>
                        
                    </div>
                </div>
                <br />
        
                <div class="row" id="lastlogindiv">
                <label for="lastlogin" class="col-sm-2 control-label form-label">Last succesful login:</label>
                <div class="col-md-6">
                    <input type="text" id="lastlogin" name="lastlogin" placeholder="Checking..." disabled
                        class="form-control border-0" />
                    </div>
                </div>
                <br />
                <input type="hidden" id="lastloginraw" name="lastloginraw" value="">

            </div>

            <div class="row">
                <label for="advancedsettings" class="col-sm-2 control-label form-label"></label>
                <div class="col-md-6 text-right">
                    <button class="btn-xs btn-link" id="advanced" type="button">Advanced Settings</button>
                </div>
            </div>

            <button class="btn btn-primary" id ="savesettings" type="button"><i class="fa fa-save"></i> Save</button>
            <button class="btn btn-primary" id="validateimap" type="button"><i class="fa fa-wrench"></i> Test Settings</button>


        </form>
        </div>
        <!-- Reporting Settings End -->
    </div>
</div>
{{end}} {{define "scripts"}}
<script src="/js/dist/app/passwords.min.js"></script>
<script src="/js/dist/app/settings.min.js"></script>
{{end}}
    <!-- Floating Tooltip System -->
    <div id="floating-tooltip" class="fixed z-50 invisible opacity-0 transition-all duration-200 ease-in-out pointer-events-none">
        <div class="bg-gray-800 text-white text-sm rounded-lg px-3 py-2 shadow-lg border border-gray-600 max-w-xs">
            <div id="tooltip-content"></div>
            <div id="tooltip-arrow" class="absolute w-2 h-2 bg-gray-800 border border-gray-600 transform rotate-45"></div>
        </div>
    </div>

    <script>
    class FloatingTooltip {
        constructor() {
            this.tooltip = document.getElementById('floating-tooltip');
            this.content = document.getElementById('tooltip-content');
            this.arrow = document.getElementById('tooltip-arrow');
            this.currentTrigger = null;
            this.hideTimeout = null;
            
            this.init();
        }
        
        init() {
            // Add event listeners to all tooltip triggers
            document.querySelectorAll('.tooltip-trigger').forEach(trigger => {
                trigger.addEventListener('mouseenter', (e) => this.show(e.target));
                trigger.addEventListener('mouseleave', () => this.hide());
            });
            
            // Hide tooltip on scroll or window resize
            window.addEventListener('scroll', () => this.hide(), true);
            window.addEventListener('resize', () => this.hide());
            
            // Hide tooltip on click outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.tooltip-trigger')) {
                    this.hide();
                }
            });
        }
        
        show(trigger) {
            clearTimeout(this.hideTimeout);
            
            const tooltipText = trigger.getAttribute('data-tooltip');
            if (!tooltipText) return;
            
            this.currentTrigger = trigger;
            this.content.textContent = tooltipText;
            
            // Make tooltip visible but still transparent for positioning
            this.tooltip.style.visibility = 'visible';
            this.tooltip.classList.remove('opacity-0');
            this.tooltip.classList.add('opacity-100');
            
            // Position the tooltip
            this.position(trigger);
        }
        
        hide() {
            this.hideTimeout = setTimeout(() => {
                this.tooltip.classList.remove('opacity-100');
                this.tooltip.classList.add('opacity-0');
                
                setTimeout(() => {
                    this.tooltip.style.visibility = 'invisible';
                    this.currentTrigger = null;
                }, 200);
            }, 100);
        }
        
        position(trigger) {
            const triggerRect = trigger.getBoundingClientRect();
            const tooltipRect = this.tooltip.getBoundingClientRect();
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const scrollX = window.pageXOffset;
            const scrollY = window.pageYOffset;
            
            let left, top, arrowLeft, arrowTop;
            
            // Default: show above the trigger
            left = triggerRect.left + (triggerRect.width / 2) - (tooltipRect.width / 2);
            top = triggerRect.top - tooltipRect.height - 10;
            
            // Arrow positioning (bottom of tooltip, pointing down)
            arrowLeft = (tooltipRect.width / 2) - 4;
            arrowTop = tooltipRect.height - 1;
            this.arrow.style.borderTopColor = '#374151';
            this.arrow.style.borderRightColor = 'transparent';
            this.arrow.style.borderBottomColor = 'transparent';
            this.arrow.style.borderLeftColor = 'transparent';
            
            // Adjust if tooltip would go off-screen
            if (left < 10) {
                left = 10;
                arrowLeft = triggerRect.left + (triggerRect.width / 2) - left - 4;
            } else if (left + tooltipRect.width > windowWidth - 10) {
                left = windowWidth - tooltipRect.width - 10;
                arrowLeft = triggerRect.left + (triggerRect.width / 2) - left - 4;
            }
            
            // If tooltip would go above viewport, show below instead
            if (top < 10) {
                top = triggerRect.bottom + 10;
                arrowTop = -4;
                this.arrow.style.borderTopColor = 'transparent';
                this.arrow.style.borderRightColor = 'transparent';
                this.arrow.style.borderBottomColor = '#374151';
                this.arrow.style.borderLeftColor = 'transparent';
            }
            
            // Apply positions
            this.tooltip.style.left = (left + scrollX) + 'px';
            this.tooltip.style.top = (top + scrollY) + 'px';
            this.arrow.style.left = arrowLeft + 'px';
            this.arrow.style.top = arrowTop + 'px';
        }
    }
    
    // Initialize tooltip system when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        new FloatingTooltip();
    });
    </script>
