{{define "body"}}
<div class="main">
<div class="modern-page users-page">
    <!-- Modern Page Header -->
    <div class="page-header-modern">
        <div>
            <h1 class="page-title">{{.Title}}</h1>
            <p class="page-subtitle">Manage administrator and user accounts</p>
        </div>
        <div class="header-actions">
            <button type="button" class="btn-modern btn-primary-modern" id="new_button" data-toggle="modal" data-backdrop="static" data-user-id="-1" data-target="#modal">
                <i class="fa fa-plus"></i> New User
            </button>
        </div>
    </div>

    <!-- Flash Messages -->
    <div class="flash-messages">
        <div id="flashes">{{template "flashes" .Flashes}}</div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading-state">
        <i class="fa fa-spinner fa-spin"></i>
        <p>Loading users...</p>
    </div>

    <!-- Users Table -->
    <div class="modern-card" id="usersCard" style="display:none;">
        <div class="modern-card-header">
            <div class="section-header" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
                <h2><i class="fa fa-users"></i> User Accounts</h2>
            </div>
        </div>
        <div class="modern-card-body">
            <div class="modern-table-wrapper">
                <table id="userTable" class="modern-table" role="table" aria-label="User accounts">
                    <thead>
                        <tr>
                            <th scope="col">Username</th>
                            <th scope="col">Role</th>
                            <th scope="col">Last Login</th>
                            <th scope="col" class="no-sort text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</div>

<!-- User Modal -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="userModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content modern-modal">
            <div class="modal-header modern-modal-header">
                <button type="button" class="close modern-close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="userModalLabel">New User</h4>
            </div>
            <div class="modal-body modern-modal-body" id="modal_body">
                <div class="row" id="modal.flashes"></div>

                <div class="form-group">
                    <label class="control-label" for="username">Username:</label>
                    <input type="text" class="form-control" placeholder="Enter username" id="username" autofocus />
                </div>

                <div class="form-group">
                    <label class="control-label" for="password">Password:</label>
                    <input type="password" class="form-control" autocomplete="new-password" placeholder="Enter password" id="password" required />
                    <div class="hidden" id="password-strength-container">
                        <div class="progress password-strength-progress" id="password-strength">
                            <div id="password-strength-bar" class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <span id="password-strength-description" class="password-strength-text"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label" for="confirm_password">Confirm Password:</label>
                    <input type="password" class="form-control" placeholder="Confirm password" id="confirm_password" required />
                </div>

                <div class="form-group checkbox-options">
                    <div class="modern-checkbox">
                        <input id="force_password_change_checkbox" type="checkbox" checked>
                        <label for="force_password_change_checkbox">Require the user to set a new password</label>
                    </div>
                    <div class="modern-checkbox">
                        <input id="account_locked_checkbox" type="checkbox">
                        <label for="account_locked_checkbox">Account Locked</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label" for="role">Role:</label>
                    <select class="form-control" id="role">
                        <option value="admin">Admin</option>
                        <option value="user">User</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer modern-modal-footer">
                <button type="button" class="btn-modern btn-secondary-modern" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn-modern btn-primary-modern" id="modalSubmit">
                    <i class="fa fa-save"></i> Save User
                </button>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script src="/js/dist/app/passwords.min.js"></script>
<script src="/js/dist/app/users.min.js"></script>
{{end}}
