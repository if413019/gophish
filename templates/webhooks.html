{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <h1 class="page-header">
        {{.Title}}
    </h1>
    <div id="flashes" class="row"></div>
    <div class="row">
        <button type="button" class="btn btn-primary" id="new_button" data-toggle="modal" data-backdrop="static"
            data-webhook-id="-1" data-target="#modal">
            <i class="fa fa-plus"></i> New Webhook</button>
    </div>
    &nbsp;
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div class="row">
        <table id="webhookTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th class="col-md-2 no-sort">Title</th>
                    <th class="col-md-2 no-sort">Url</th>
                    <th class="col-md-2 no-">Is active</th>
                    <th class="col-md-2 no-sort"></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="webhookModalLabel">Add or Edit Webhook</h4>
            </div>
            <div class="modal-body" id="modal_body">
                <div class="row" id="modal.flashes"></div>
                <label class="control-label" for="title">Name:</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Name" id="name" required autofocus />
                </div>

                <label class="control-label" for="url">URL:</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="https://example.com/webhook1" id="url" required />
                </div>

                <label class="control-label" for="secret">Secret:</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Secret" id="secret" required />
                </div>

                <div class="checkbox checkbox-primary">
                    <input type="checkbox" id="is_active" value="true" />
                    <label for="is_active">Is active <span class="tooltip-trigger relative inline-block ml-1" data-tooltip="Data is sent only to the active webhooks">
                            <i class="fa fa-question-circle text-cyan-400/70 cursor-help hover:text-cyan-300 transition-colors"></i>
                        </span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save changes</button>
            </div>
        </div>
    </div>
</div>


{{end}} {{define "scripts"}}
<script src="/js/dist/app/webhooks.min.js"></script>
{{end}}

    <!-- Floating Tooltip System -->
    <div id="floating-tooltip" class="fixed z-50 invisible opacity-0 transition-all duration-200 ease-in-out pointer-events-none">
        <div class="bg-gray-800 text-white text-sm rounded-lg px-3 py-2 shadow-lg border border-gray-600 max-w-xs">
            <div id="tooltip-content"></div>
            <div id="tooltip-arrow" class="absolute w-2 h-2 bg-gray-800 border border-gray-600 transform rotate-45"></div>
        </div>
    </div>

    <script>
    class FloatingTooltip {
        constructor() {
            this.tooltip = document.getElementById('floating-tooltip');
            this.content = document.getElementById('tooltip-content');
            this.arrow = document.getElementById('tooltip-arrow');
            this.currentTrigger = null;
            this.hideTimeout = null;
            
            this.init();
        }
        
        init() {
            // Add event listeners to all tooltip triggers
            document.querySelectorAll('.tooltip-trigger').forEach(trigger => {
                trigger.addEventListener('mouseenter', (e) => this.show(e.target));
                trigger.addEventListener('mouseleave', () => this.hide());
            });
            
            // Hide tooltip on scroll or window resize
            window.addEventListener('scroll', () => this.hide(), true);
            window.addEventListener('resize', () => this.hide());
            
            // Hide tooltip on click outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.tooltip-trigger')) {
                    this.hide();
                }
            });
        }
        
        show(trigger) {
            clearTimeout(this.hideTimeout);
            
            const tooltipText = trigger.getAttribute('data-tooltip');
            if (!tooltipText) return;
            
            this.currentTrigger = trigger;
            this.content.textContent = tooltipText;
            
            // Make tooltip visible but still transparent for positioning
            this.tooltip.style.visibility = 'visible';
            this.tooltip.classList.remove('opacity-0');
            this.tooltip.classList.add('opacity-100');
            
            // Position the tooltip
            this.position(trigger);
        }
        
        hide() {
            this.hideTimeout = setTimeout(() => {
                this.tooltip.classList.remove('opacity-100');
                this.tooltip.classList.add('opacity-0');
                
                setTimeout(() => {
                    this.tooltip.style.visibility = 'invisible';
                    this.currentTrigger = null;
                }, 200);
            }, 100);
        }
        
        position(trigger) {
            const triggerRect = trigger.getBoundingClientRect();
            const tooltipRect = this.tooltip.getBoundingClientRect();
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const scrollX = window.pageXOffset;
            const scrollY = window.pageYOffset;
            
            let left, top, arrowLeft, arrowTop;
            
            // Default: show above the trigger
            left = triggerRect.left + (triggerRect.width / 2) - (tooltipRect.width / 2);
            top = triggerRect.top - tooltipRect.height - 10;
            
            // Arrow positioning (bottom of tooltip, pointing down)
            arrowLeft = (tooltipRect.width / 2) - 4;
            arrowTop = tooltipRect.height - 1;
            this.arrow.style.borderTopColor = '#374151';
            this.arrow.style.borderRightColor = 'transparent';
            this.arrow.style.borderBottomColor = 'transparent';
            this.arrow.style.borderLeftColor = 'transparent';
            
            // Adjust if tooltip would go off-screen
            if (left < 10) {
                left = 10;
                arrowLeft = triggerRect.left + (triggerRect.width / 2) - left - 4;
            } else if (left + tooltipRect.width > windowWidth - 10) {
                left = windowWidth - tooltipRect.width - 10;
                arrowLeft = triggerRect.left + (triggerRect.width / 2) - left - 4;
            }
            
            // If tooltip would go above viewport, show below instead
            if (top < 10) {
                top = triggerRect.bottom + 10;
                arrowTop = -4;
                this.arrow.style.borderTopColor = 'transparent';
                this.arrow.style.borderRightColor = 'transparent';
                this.arrow.style.borderBottomColor = '#374151';
                this.arrow.style.borderLeftColor = 'transparent';
            }
            
            // Apply positions
            this.tooltip.style.left = (left + scrollX) + 'px';
            this.tooltip.style.top = (top + scrollY) + 'px';
            this.arrow.style.left = arrowLeft + 'px';
            this.arrow.style.top = arrowTop + 'px';
        }
    }
    
    // Initialize tooltip system when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        new FloatingTooltip();
    });
    </script>
