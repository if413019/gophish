{{ define "base" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gophish - Phishing Toolkit">
    <meta name="author" content="Jordan Wright (http://github.com/jordan-wright)">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="shortcut icon" href="/images/favicon.ico">

    <title>{{ .Title }} - Gophish</title>

    <link href="/css/dist/gophish.css" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Roboto:700,500' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,300,600,700' rel='stylesheet' type='text/css'>
    <script>
        {{if .User}}
    var user = {
        api_key : {{ .User.ApiKey }},
        username : {{ .User.Username }}
    }
    {{end}}
    {{if .Token}}
        var csrf_token = {{.Token}}
    {{end}}
    </script>
</head>

<body>
    <!-- Modern Top Header -->
    <header class="modern-header">
        <div class="header-left">
            <button type="button" class="mobile-menu-toggle" id="mobile-menu-toggle">
                <i class="fa fa-bars"></i>
            </button>
        </div>
        <div class="header-right">
            {{if .User}}
            <div class="header-user-menu">
                <a href="/settings" class="user-info">
                    <div class="user-avatar">
                        <i class="fa fa-user"></i>
                    </div>
                    <span class="user-name">{{.User.Username}}</span>
                </a>
                <a href="/logout" class="logout-btn" title="Logout">
                    <i class="fa fa-sign-out"></i>
                </a>
            </div>
            {{else}}
            <a href="/login" class="btn-modern btn-primary-modern btn-sm-modern">
                <i class="fa fa-sign-in"></i> Login
            </a>
            {{end}}
        </div>
    </header>

    <style>
    /* Modern Header Styling */
    .modern-header {
        position: fixed;
        top: 0;
        left: 256px;
        right: 0;
        height: 64px;
        background: hsl(0 0% 100%);
        border-bottom: 1px solid hsl(210 40% 94%);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
        z-index: 999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .mobile-menu-toggle {
        display: none;
        background: none;
        border: none;
        padding: 0.5rem;
        font-size: 1.25rem;
        color: hsl(210 40% 40%);
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.2s ease;
    }

    .mobile-menu-toggle:hover {
        background: hsl(210 40% 96%);
        color: hsl(210 40% 20%);
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .header-user-menu {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .user-info {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        text-decoration: none;
        color: hsl(210 40% 20%);
        transition: all 0.2s ease;
    }

    .user-info:hover {
        background: hsl(210 40% 96%);
        text-decoration: none;
        color: hsl(210 40% 20%);
    }

    .user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 14px;
    }

    .user-name {
        font-weight: 500;
        font-size: 14px;
    }

    .logout-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        color: hsl(0 60% 50%);
        text-decoration: none;
        transition: all 0.2s ease;
    }

    .logout-btn:hover {
        background: hsl(0 60% 97%);
        color: hsl(0 70% 45%);
        text-decoration: none;
    }

    /* Adjust main content for fixed header */
    .main {
        margin-left: 256px;
        background: #f8f9fa;
        min-height: calc(100vh - 64px);
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
        .modern-header {
            left: 0;
        }

        .mobile-menu-toggle {
            display: block;
        }

        .user-name {
            display: none;
        }

        .main {
            margin-left: 0;
        }
    }
    </style>
    {{template "nav" .}}
    {{template "body" .}}
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/dist/vendor.min.js"></script>
    <script src="/js/dist/app/gophish.min.js"></script>
    {{template "scripts" .}}
</body>

</html>
{{ end }}
