{{define "body"}}
<div class="main">
<div class="user-courses-page">
    <div class="page-header">
        <div class="header-content">
            <div class="back-nav">
                <a href="/" class="back-btn">
                    <i class="fa fa-arrow-left"></i>
                    Back to Dashboard
                </a>
            </div>
            <h1>My Courses</h1>
            <p class="subtitle">Complete your assigned security awareness training</p>
        </div>
    </div>

    <div class="courses-filter">
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All Courses</button>
            <button class="filter-tab" data-filter="in_progress">In Progress</button>
            <button class="filter-tab" data-filter="completed">Completed</button>
            <button class="filter-tab" data-filter="not_started">Not Started</button>
        </div>
        <div class="search-box">
            <i class="fa fa-search"></i>
            <input type="text" placeholder="Search courses..." id="courseSearch">
        </div>
    </div>

    <div class="courses-grid" id="coursesGrid">
        <div class="loading-state">
            <i class="fa fa-spinner fa-spin"></i>
            <p>Loading your courses...</p>
        </div>
    </div>
</div>
</div>

<style>
.user-courses-page {
    padding: 2rem;
    background: #f8f9fa;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

.page-header {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding: 2rem;
    border-radius: 16px;
    margin-bottom: 2rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.back-nav {
    margin-bottom: 1rem;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: #667eea;
    text-decoration: none;
    font-weight: 500;
    padding: 0.5rem 1rem;
    border: 1px solid #667eea;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.back-btn:hover {
    background: #667eea;
    color: white;
    text-decoration: none;
}

.page-header h1 {
    color: #2d3748;
    font-size: 2.5rem;
    font-weight: 700;
    margin: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.page-header .subtitle {
    color: #718096;
    font-size: 1.1rem;
    margin: 0.5rem 0 0 0;
    font-weight: 500;
}

.courses-filter {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding: 1.5rem 2rem;
    border-radius: 16px;
    margin-bottom: 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 2rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

@media (max-width: 768px) {
    .courses-filter {
        flex-direction: column;
        gap: 1rem;
    }
}

.filter-tabs {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
}

.filter-tab {
    padding: 0.75rem 1.5rem;
    border: none;
    background: transparent;
    color: #718096;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.filter-tab.active,
.filter-tab:hover {
    background: #667eea;
    color: white;
}

.search-box {
    position: relative;
    display: flex;
    align-items: center;
}

.search-box i {
    position: absolute;
    left: 1rem;
    color: #a0aec0;
    z-index: 1;
}

.search-box input {
    padding: 0.75rem 1rem 0.75rem 2.5rem;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: white;
    color: #2d3748;
    width: 250px;
    font-size: 0.9rem;
}

.search-box input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.courses-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 2rem;
}

.course-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 2rem;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.course-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
}

.course-status-badge {
    position: absolute;
    top: 1rem;
    right: 1rem;
    padding: 0.25rem 0.75rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
}

.course-status-badge.completed {
    background: #c6f6d5;
    color: #22543d;
}

.course-status-badge.in_progress {
    background: #fed7d7;
    color: #742a2a;
}

.course-status-badge.not_started {
    background: #e2e8f0;
    color: #4a5568;
}

.course-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5rem;
    margin-bottom: 1.5rem;
}

.course-title {
    color: #2d3748;
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 0.5rem 0;
    line-height: 1.3;
}

.course-description {
    color: #718096;
    font-size: 0.9rem;
    line-height: 1.5;
    margin: 0 0 1.5rem 0;
}

.course-progress {
    margin-bottom: 1.5rem;
}

.progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
}

.progress-label {
    color: #4a5568;
    font-size: 0.85rem;
    font-weight: 500;
}

.progress-percentage {
    color: #667eea;
    font-size: 0.85rem;
    font-weight: 600;
}

.progress-bar {
    height: 8px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 4px;
    transition: width 0.3s ease;
}

.course-actions {
    display: flex;
    gap: 1rem;
}

.course-btn {
    flex: 1;
    padding: 0.75rem 1rem;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.9rem;
}

.course-btn.primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.course-btn.primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    text-decoration: none;
    color: white;
}

.course-btn.secondary {
    background: transparent;
    color: #667eea;
    border: 1px solid #667eea;
}

.course-btn.secondary:hover {
    background: #667eea;
    color: white;
    text-decoration: none;
}

.loading-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 2rem;
    color: rgba(255, 255, 255, 0.8);
}

.loading-state i {
    font-size: 3rem;
    margin-bottom: 1rem;
}

.loading-state p {
    font-size: 1.2rem;
    margin: 0;
}

.empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 2rem;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.empty-state i {
    font-size: 4rem;
    color: #a0aec0;
    margin-bottom: 1rem;
}

.empty-state h3 {
    color: #2d3748;
    font-size: 1.5rem;
    margin: 0 0 0.5rem 0;
}

.empty-state p {
    color: #718096;
    margin: 0;
}
</style>
{{end}}

{{define "scripts"}}
<script>
$(document).ready(function() {
    loadUserCourses();
    initializeFilters();
});

function loadUserCourses() {
    $.get('/api/user/courses/active')
        .done(function(courses) {
            renderCourses(courses);
        })
        .fail(function() {
            $('#coursesGrid').html(`
                <div class="empty-state">
                    <i class="fa fa-exclamation-triangle"></i>
                    <h3>Error Loading Courses</h3>
                    <p>Unable to load your courses. Please refresh and try again.</p>
                </div>
            `);
        });
}

function renderCourses(courses) {
    var container = $('#coursesGrid');
    
    if (courses.length === 0) {
        container.html(`
            <div class="empty-state">
                <i class="fa fa-graduation-cap"></i>
                <h3>No Courses Yet</h3>
                <p>You haven't been assigned any courses yet. Check back later!</p>
            </div>
        `);
        return;
    }
    
    var html = '';
    courses.forEach(function(course) {
        var statusClass = course.status || 'not_started';
        var statusText = getStatusText(course.status);
        var progress = course.progress || 0;
        
        html += `
            <div class="course-card" data-status="${statusClass}" data-name="${course.name.toLowerCase()}">
                <div class="course-status-badge ${statusClass}">${statusText}</div>
                <div class="course-icon">
                    <i class="fa fa-shield"></i>
                </div>
                <h3 class="course-title">${course.name}</h3>
                <p class="course-description">${course.description}</p>
                <div class="course-progress">
                    <div class="progress-header">
                        <span class="progress-label">Progress</span>
                        <span class="progress-percentage">${progress}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                </div>
                <div class="course-actions">
                    ${getCourseActions(course)}
                </div>
            </div>
        `;
    });
    
    container.html(html);
}

function getStatusText(status) {
    switch(status) {
        case 'completed': return 'Completed';
        case 'in_progress': return 'In Progress';
        default: return 'Not Started';
    }
}

function getCourseActions(course) {
    var progress = course.progress || 0;
    
    if (course.status === 'completed') {
        return `
            <a href="/user/courses/${course.id}" class="course-btn primary">
                <i class="fa fa-eye"></i>
                Review Course
            </a>
        `;
    } else if (progress > 0) {
        return `
            <a href="/user/courses/${course.id}" class="course-btn primary">
                <i class="fa fa-play"></i>
                Continue Course
            </a>
        `;
    } else {
        return `
            <a href="/user/courses/${course.id}" class="course-btn primary">
                <i class="fa fa-play"></i>
                Start Course
            </a>
        `;
    }
}

function initializeFilters() {
    // Filter tabs
    $('.filter-tab').on('click', function() {
        $('.filter-tab').removeClass('active');
        $(this).addClass('active');
        
        var filter = $(this).data('filter');
        filterCourses(filter);
    });
    
    // Search functionality
    $('#courseSearch').on('input', function() {
        var searchTerm = $(this).val().toLowerCase();
        searchCourses(searchTerm);
    });
}

function filterCourses(filter) {
    $('.course-card').each(function() {
        var card = $(this);
        var status = card.data('status');
        
        if (filter === 'all' || status === filter) {
            card.show();
        } else {
            card.hide();
        }
    });
}

function searchCourses(searchTerm) {
    $('.course-card').each(function() {
        var card = $(this);
        var name = card.data('name');
        
        if (name.includes(searchTerm)) {
            card.show();
        } else {
            card.hide();
        }
    });
}
</script>
{{end}}
