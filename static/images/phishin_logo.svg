  <!-- Text -->
  <text x="65" y="25" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2937">
    phi.shin
  </text>
  <text x="65" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6b7280">
